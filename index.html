<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portafolio Multi-temático</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; text-align: center; }
    h1 { color: #333; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
    .card { background: white; padding: 20px; border-radius: 8px; width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card a { text-decoration: none; color: #0066cc; font-weight: bold; }
  </style>
</head>
<body>
  <h1>¡Hola! Bienvenido a mi rincón web</h1>
  <p>Aquí comparto mis proyectos en distintas áreas:</p>

  <div class="grid">
    <div class="card">
      <h3>💻 Programación</h3>
      <p>Mis apps y scripts.</p>
    </div>
    <div class="card">
      <h3>🎨 Arte</h3>
      <p>Dibujos y diseños.</p>
    </div>
    <div class="card">
      <h3>⚽ Deporte</h3>
      <p>Rutinas y logros.</p>
    </div>
    <div class="card">
      <h3>✂️ Manualidades</h3>
      <p>Creaciones hechas a mano.</p>
    </div>
  </div>
</body>
</html>
